[project]
name = "06_retail_dev"
version = "0.0.1"
description = "Personal Retail Analytics Data Engineering project using Databricks Asset Bundles"
authors = [
    { name = "25001437@student.datapot.edu.vn" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "databricks-connect>=19.0,<20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[project.scripts]
main = "06_retail_dev.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120